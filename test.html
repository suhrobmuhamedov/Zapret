<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <title>Toshkent tumani uchun DMED Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="style.css" id="theme-link" />
  <link rel="stylesheet" href="style-bright.css" id="theme-link-bright" disabled />
  <style>
    .question { transition: all 0.3s ease; }
    .options label { 
      display: block; 
      padding: 10px; 
      margin: 5px 0; 
      cursor: pointer; 
      border-radius: 20px; 
      background: rgba(255,255,255,0.1); 
    }
    .options input { margin-right: 10px; }
    .correct { border: 2px solid #00ff00 !important; }
    .wrong { border: 2px solid #ff0000 !important; }
    .result { margin-top: 20px; font-size: 1.5em; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="text-3d">DMED TEST</h1>
  </div>
    <p><div class="subtitle">Tuzuvchi:<a href="https://t.me/Muhamedov_S">Muxamedov Suhrob</a></div></p>


  <div class="tabs" id="tabs">
    <div class="button3d tab active" onclick="loadQuiz('1.txt', this)">Test 1</div>
    <div class="button3d tab" onclick="loadQuiz('2.txt', this)">Test 2</div>
    <div class="button3d tab" onclick="loadQuiz('3.txt', this)">PRO</div>
  </div>
  
  <div id="quiz"></div>

  <div class="controls">
    <button class="button3d primary" onclick="checkAnswers()">✓ Tekshirish</button>
    <button class="button3d secondary" onclick="resetQuiz()">↻ Qaytadan boshlash</button>
  </div>

  <button class="style-switcher" onclick="toggleStyle()">Qorong'u Yorqin almashtirish</button>

  <div id="result"></div>
  
  <div class="footer">
    <div class="copyright"><a href="https://t.me/Muhamedov_S">© Suhrob 003</a></div>
    <div style="margin-top: 8px;">Toshkent tumani uchun DMED Test</div>
  </div>
</div>

<script>
let currentQuiz = [];
let currentFile = '1.txt';

// Sahifa yuklanganda birinchi testni yuklash
loadQuiz('1.txt', document.querySelector('.tab.active'));

function loadQuiz(filename, btn) {
  currentFile = filename;
  
  // Tablarni yangilash
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  
  // Testlarni yuklash
  fetch(filename)
    .then(res => res.text())
    .then(text => parseFile(text))
    .catch(err => {
      document.getElementById('quiz').innerHTML = `<div class="loading">❌ ${filename} fayli topilmadi</div>`;
    });
}

function parseFile(text) {
  const questions = [];
  const blocks = text.trim().split(/\n\s*\n/);
  
  blocks.forEach(block => {
    const allLines = block.split('\n').map(l => l.trim());
    
    // Faqat ===== yoki +++++ bo'lmagan qatorlarni olish
    const lines = allLines.filter(l => {
      const clean = l.replace(/\+{2,}/g, '').replace(/={4,}/g, '').trim();
      return clean.length > 0;
    });
    
    if (lines.length >= 2) {
      // Birinchi qator - savol
      let questionText = lines[0].replace(/\+{2,}/g, '').replace(/={4,}/g, '').trim();
      const options = [];
      let correctIndex = -1;

      // Qolgan qatorlar - javob variantlari
      lines.slice(1).forEach((line) => {
        let cleanLine = line.replace(/\+{2,}/g, '').replace(/={4,}/g, '').trim();
        
        // # bilan boshlangan - to'g'ri javob
        if (line.startsWith('#')) {
          correctIndex = options.length;
          cleanLine = cleanLine.replace(/^#\s*/, '').trim();
        }
        
        // Bo'sh bo'lmagan javoblarni qo'shish
        if (cleanLine.length > 0) {
          options.push(cleanLine);
        }
      });

      // Agar savol va javoblar mavjud bo'lsa qo'shish
      if (questionText.length > 0 && options.length > 0 && correctIndex >= 0) {
        questions.push({ question: questionText, options, correct: correctIndex });
      }
    }
  });

  // Random 15 ta test tanlash
  const shuffled = questions.sort(() => Math.random() - 0.5);
  currentQuiz = shuffled.slice(0, 15);
  renderQuiz();
}

function renderQuiz() {
  const quiz = document.getElementById('quiz');
  quiz.innerHTML = '';
  
  if (currentQuiz.length === 0) {
    quiz.innerHTML = '<div class="loading">Testlar topilmadi</div>';
    return;
  }
  
  currentQuiz.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = 'section question';
    div.innerHTML = `<div class="question-text ajral1">${i+1}. ${q.question}</div>` +
      '<div class="options">' +
      q.options.map((opt, j) =>
        `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`
      ).join('') +
      '</div>';
    quiz.appendChild(div);
  });
  document.getElementById('result').innerHTML = '';
}

function checkAnswers() {
  let correctCount = 0;
  document.querySelectorAll('.question').forEach((div, i) => {
    const selected = div.querySelector('input:checked');
    if (!selected) return;
    if (Number(selected.value) === currentQuiz[i].correct) {
      div.classList.add('correct');
      div.style.boxShadow = "0 0 20px #00ff00";
      correctCount++;
    } else {
      div.classList.add('wrong');
      div.style.boxShadow = "0 0 20px #ff0000";
    }
  });
  document.getElementById('result').innerHTML =
    `<div class="section tip-card result">🎯 Natija: ${correctCount} / ${currentQuiz.length} ta to'g'ri javob</div>`;
}

function resetQuiz() {
  renderQuiz();
}

function toggleStyle() {
  const themeLink = document.getElementById('theme-link');
  const themeLinkBright = document.getElementById('theme-link-bright');

  if (themeLink.disabled) {
    themeLink.disabled = false;
    themeLinkBright.disabled = true;
  } else {
    themeLink.disabled = true;
    themeLinkBright.disabled = false;
  }
}
</script>
</body>
</html>
